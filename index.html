<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Thời Gian Dùng Điện Thoại Gia Đình</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 font-sans p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        <h1 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-2">📱 Thống Kê Sử Dụng Điện Thoại Gia Đình</h1>
        <p class="text-center text-gray-500 mb-6">Theo dõi thời gian sử dụng trong 7 ngày gần nhất</p>

        <!-- Grid for Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Bố -->
            <div class="bg-white rounded-2xl shadow p-4 border-t-4 border-blue-500">
                <h2 class="text-xl font-semibold text-center text-blue-600 mb-2">👨 Điện Thoại Bố</h2>
                <div class="relative h-[250px] w-full">
                    <canvas id="chartBo"></canvas>
                </div>
            </div>
            <!-- Mẹ -->
            <div class="bg-white rounded-2xl shadow p-4 border-t-4 border-pink-500">
                <h2 class="text-xl font-semibold text-center text-pink-500 mb-2">👩 Điện Thoại Mẹ</h2>
                <div class="relative h-[250px] w-full">
                    <canvas id="chartMe"></canvas>
                </div>
            </div>
            <!-- Bà -->
            <div class="bg-white rounded-2xl shadow p-4 border-t-4 border-green-500">
                <h2 class="text-xl font-semibold text-center text-green-600 mb-2">👵 Điện Thoại Bà</h2>
                <div class="relative h-[250px] w-full">
                    <canvas id="chartBa"></canvas>
                </div>
            </div>
            <!-- Con -->
            <div class="bg-white rounded-2xl shadow p-4 border-t-4 border-purple-500">
                <h2 class="text-xl font-semibold text-center text-purple-600 mb-2">👦 Điện Thoại Con</h2>
                <div class="relative h-[250px] w-full">
                    <canvas id="chartCon"></canvas>
                </div>
            </div>
        </div>

        <!-- Refresh Button -->
        <div class="mt-8 flex flex-col items-center justify-center gap-2">
            <button id="refreshBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:-translate-y-1 flex items-center justify-center w-full md:w-auto">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Cập nhật thời gian hôm nay
            </button>
            <p class="text-sm text-gray-500 text-center">
                *Mô phỏng hành động sử dụng thêm điện thoại trong ngày hôm nay của cả nhà.
            </p>
        </div>
    </div>

    <script>
        // Generate labels for last 7 days
        const getLast7Days = () => {
            const labels = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                if (i === 0) labels.push('Hôm nay');
                else labels.push(`${d.getDate()}/${d.getMonth() + 1}`);
            }
            return labels;
        };
        const daysLabels = getLast7Days();

        // Generic chart config function
        const createChartConfig = (label, data, color) => ({
            type: 'bar',
            data: {
                labels: daysLabels,
                datasets: [{
                    label: label,
                    data: data,
                    backgroundColor: color.bg,
                    borderColor: color.border,
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 10,
                        title: { display: true, text: 'Giờ sử dụng' }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) { return context.parsed.y.toFixed(1) + ' giờ'; }
                        }
                    }
                }
            }
        });

        // Colors configurations
        const colors = {
            bo: { bg: 'rgba(59, 130, 246, 0.6)', border: 'rgba(59, 130, 246, 1)' },     // blue
            me: { bg: 'rgba(236, 72, 153, 0.6)', border: 'rgba(236, 72, 153, 1)' },    // pink
            ba: { bg: 'rgba(34, 197, 94, 0.6)', border: 'rgba(34, 197, 94, 1)' },      // green
            con: { bg: 'rgba(168, 85, 247, 0.6)', border: 'rgba(168, 85, 247, 1)' }    // purple
        };

        // Mock Data
        const dataBo = [2.5, 3.0, 2.8, 3.5, 4.0, 3.2, 1.5];
        const dataMe = [4.0, 3.5, 4.2, 3.8, 5.0, 4.5, 2.0];
        const dataBa = [1.5, 1.2, 1.8, 1.5, 2.0, 1.7, 0.8];
        const dataCon = [1.0, 1.5, 1.2, 2.0, 4.5, 5.5, 3.0];

        // Initialize Charts
        const charts = [
            new Chart(document.getElementById('chartBo').getContext('2d'), createChartConfig('Bố', dataBo, colors.bo)),
            new Chart(document.getElementById('chartMe').getContext('2d'), createChartConfig('Mẹ', dataMe, colors.me)),
            new Chart(document.getElementById('chartBa').getContext('2d'), createChartConfig('Bà', dataBa, colors.ba)),
            new Chart(document.getElementById('chartCon').getContext('2d'), createChartConfig('Con', dataCon, colors.con))
        ];

        // Refresh Button Logic
        document.getElementById('refreshBtn').addEventListener('click', () => {
            charts.forEach(chart => {
                const dataset = chart.data.datasets[0];
                const todayIndex = dataset.data.length - 1;
                
                // Increase by random 0.1 to 0.5 hours
                const increase = (Math.random() * 0.4) + 0.1;
                dataset.data[todayIndex] = Math.min(24, dataset.data[todayIndex] + increase);
                chart.update();
            });

            const btn = document.getElementById('refreshBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'Đã cập nhật! ✓';
            btn.classList.replace('bg-indigo-600', 'bg-emerald-500');
            btn.classList.replace('hover:bg-indigo-700', 'hover:bg-emerald-600');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('bg-emerald-500', 'bg-indigo-600');
                btn.classList.replace('hover:bg-emerald-600', 'hover:bg-indigo-700');
            }, 1000);
        });
    </script>
</body>
</html>
