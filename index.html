<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Thời Gian Sử Dụng Điện Thoại</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 font-sans p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">📱 Dashboard Quản Lý Thời Gian Sử Dụng</h1>
            <p class="text-gray-500">Phân tích chi tiết thói quen dùng điện thoại của gia đình</p>
        </div>

        <!-- BẢNG ĐIỀU KHIỂN & COMBOBOX -->
        <div class="bg-white rounded-2xl shadow-lg p-4 md:p-6 border-l-4 border-yellow-400">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="w-full md:w-1/3">
                    <label for="userSelect" class="block text-sm font-bold text-gray-700 mb-2 flex items-center">
                        <svg class="w-5 h-5 mr-1 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                        Bộ lọc người dùng:
                    </label>
                    <select id="userSelect" class="block w-full px-4 py-3 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 rounded-lg border bg-gray-50 cursor-pointer shadow-sm">
                        <option value="all">-- Tất cả gia đình --</option>
                        <option value="bo">Bố</option>
                        <option value="me">Mẹ</option>
                        <option value="khanh">Nhật Khánh</option>
                        <option value="linh">Nhật Linh</option>
                    </select>
                </div>
                <div class="text-sm text-gray-500 italic">
                    * Chọn một người để xem thông tin chi tiết và lọc dữ liệu trên biểu đồ.
                </div>
            </div>

            <!-- Khu vực hiển thị thông tin chi tiết -->
            <div id="userInfoDisplay" class="mt-6 hidden grid-cols-1 md:grid-cols-3 gap-4 transition-all duration-300 border-t pt-6">
                <!-- Data will be injected here -->
            </div>
        </div>

        <!-- 2 BIỂU ĐỒ -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Biểu đồ 1 -->
            <div class="bg-white rounded-2xl shadow-lg p-4 md:p-6 border-t-4 border-indigo-500">
                <h2 class="text-lg md:text-xl font-bold text-center text-gray-800 mb-1">📈 Thời gian dùng theo ngày (7 ngày)</h2>
                <div class="relative h-[350px] w-full mt-4">
                    <canvas id="dailyUsageChart"></canvas>
                </div>
            </div>

            <!-- Biểu đồ 2 -->
            <div class="bg-white rounded-2xl shadow-lg p-4 md:p-6 border-t-4 border-teal-500">
                <h2 class="text-lg md:text-xl font-bold text-center text-gray-800 mb-1">🔄 Phân bổ mượn thiết bị</h2>
                <div class="relative h-[350px] w-full mt-4">
                    <canvas id="crossUsageChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Nút Refresh -->
        <div class="flex flex-col items-center justify-center gap-2 mt-4 pb-8">
            <button id="refreshBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-full shadow-md transition duration-300 ease-in-out transform hover:scale-105 flex items-center justify-center w-full md:w-auto">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Mô phỏng cập nhật dữ liệu hôm nay
            </button>
        </div>
    </div>

    <script>
        // --- DATA SETUP ---
        const getLast7Days = () => {
            const labels = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                labels.push(i === 0 ? 'Hôm nay' : `${d.getDate()}/${d.getMonth() + 1}`);
            }
            return labels;
        };
        const daysLabels = getLast7Days();

        const colors = {
            bo: '#64748b',    // Xám đậm
            me: '#94a3b8',    // Xám nhạt
            khanh: '#3b82f6', // Xanh dương
            linh: '#ec4899'   // Hồng
        };

        const baseUserLabels = ['Bố', 'Mẹ', 'Nhật Khánh', 'Nhật Linh'];

        const originalDailyDatasets = [
            { id: 'bo', label: 'Bố', data: [2.5, 3.0, 2.8, 3.5, 4.0, 3.2, 1.5], borderColor: colors.bo, backgroundColor: colors.bo, tension: 0.4, borderWidth: 3, borderDash: [5, 5] },
            { id: 'me', label: 'Mẹ', data: [4.0, 3.5, 4.2, 3.8, 5.0, 4.5, 2.0], borderColor: colors.me, backgroundColor: colors.me, tension: 0.4, borderWidth: 3, borderDash: [5, 5] },
            { id: 'khanh', label: 'Nhật Khánh', data: [1.0, 1.5, 1.2, 2.0, 4.5, 5.5, 3.0], borderColor: colors.khanh, backgroundColor: colors.khanh, tension: 0.4, borderWidth: 4 },
            { id: 'linh', label: 'Nhật Linh', data: [2.0, 2.5, 1.8, 3.0, 3.5, 4.5, 3.5], borderColor: colors.linh, backgroundColor: colors.linh, tension: 0.4, borderWidth: 4 }
        ];

        const originalCrossDatasets = [
            { label: 'Dùng máy của Bố', data: [18, 1, 4, 1], backgroundColor: colors.bo },
            { label: 'Dùng máy của Mẹ', data: [0.5, 20, 8, 5], backgroundColor: colors.me },
            { label: 'Dùng máy cá nhân (Khánh)', data: [0, 0, 5, 0], backgroundColor: colors.khanh },
            { label: 'Dùng máy cá nhân (Linh)', data: [0, 0, 0, 6], backgroundColor: colors.linh }
        ];

        // --- KHỞI TẠO BIỂU ĐỒ ---
        const ctxDaily = document.getElementById('dailyUsageChart').getContext('2d');
        const dailyChart = new Chart(ctxDaily, {
            type: 'line',
            data: { labels: daysLabels, datasets: JSON.parse(JSON.stringify(originalDailyDatasets)) },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, max: 10 } },
                plugins: { tooltip: { mode: 'index', intersect: false } }
            }
        });

        const ctxCross = document.getElementById('crossUsageChart').getContext('2d');
        const crossChart = new Chart(ctxCross, {
            type: 'bar',
            data: { labels: baseUserLabels, datasets: JSON.parse(JSON.stringify(originalCrossDatasets)) },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { x: { stacked: true }, y: { stacked: true } }
            }
        });


        // --- LOGIC LỌC COMBOBOX & DỮ LIỆU APP ---
        const userDetails = {
            bo: {
                name: 'Bố', totalTime: '20.5 giờ', favoriteDevice: 'Chỉ dùng máy cá nhân', color: 'text-slate-700', bgColor: 'bg-slate-100', icon: '👨',
                apps: [
                    { name: 'Đọc báo / Web', percent: '40%' },
                    { name: 'Zalo', percent: '30%' },
                    { name: 'YouTube', percent: '20%' }
                ]
            },
            me: {
                name: 'Mẹ', totalTime: '28.0 giờ', favoriteDevice: 'Dùng máy cá nhân, đôi khi mượn Bố', color: 'text-slate-600', bgColor: 'bg-slate-50', icon: '👩',
                apps: [
                    { name: 'Facebook', percent: '40%' },
                    { name: 'TikTok', percent: '35%' },
                    { name: 'Shopee', percent: '15%' }
                ]
            },
            khanh: {
                name: 'Nhật Khánh', totalTime: '18.7 giờ', favoriteDevice: 'Thường mượn điện thoại Mẹ', color: 'text-blue-600', bgColor: 'bg-blue-50', icon: '👦',
                apps: [
                    { name: 'YouTube', percent: '35%' },
                    { name: 'Poki (Game)', percent: '25%' },
                    { name: 'Duolingo', percent: '20%' },
                    { name: 'Zalo', percent: '10%' },
                    { name: 'Phone / Message', percent: '10%' }
                ]
            },
            linh: {
                name: 'Nhật Linh', totalTime: '20.8 giờ', favoriteDevice: 'Thường mượn điện thoại Mẹ', color: 'text-pink-600', bgColor: 'bg-pink-50', icon: '👧',
                apps: [
                    { name: 'Facebook', percent: '30%' },
                    { name: 'Messenger', percent: '25%' },
                    { name: 'YouTube', percent: '20%' },
                    { name: 'Zalo', percent: '15%' },
                    { name: 'Duolingo', percent: '10%' }
                ]
            }
        };

        document.getElementById('userSelect').addEventListener('change', function(e) {
            const val = e.target.value;
            const display = document.getElementById('userInfoDisplay');
            
            if (val === 'all' || !val) {
                display.classList.add('hidden');
                display.classList.remove('grid');
                dailyChart.data.datasets = JSON.parse(JSON.stringify(originalDailyDatasets));
                crossChart.data.labels = baseUserLabels;
                crossChart.data.datasets = JSON.parse(JSON.stringify(originalCrossDatasets));
            } else {
                const user = userDetails[val];
                
                // Render danh sách app
                const appsHtml = user.apps.map(app => 
                    `<div class="bg-white p-2 flex justify-between items-center rounded border border-gray-100 shadow-sm">
                        <span class="text-gray-800 font-semibold text-sm">${app.name}</span>
                        <span class="text-indigo-600 font-bold text-sm">${app.percent}</span>
                    </div>`
                ).join('');

                display.innerHTML = `
                    <div class="p-4 rounded-xl ${user.bgColor} flex flex-col justify-center items-center border border-gray-100">
                        <span class="text-4xl mb-2">${user.icon}</span>
                        <h3 class="font-bold text-xl ${user.color}">${user.name}</h3>
                    </div>
                    <div class="p-4 rounded-xl border border-gray-200 bg-gray-50 flex flex-col justify-center">
                        <p class="text-sm text-gray-500 font-medium">Tổng thời gian (7 ngày)</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1">${user.totalTime}</p>
                        <p class="text-sm text-gray-500 font-medium mt-4">Thiết bị mượn nhiều nhất</p>
                        <p class="font-semibold text-gray-800 mt-1">${user.favoriteDevice}</p>
                    </div>
                    <div class="p-4 rounded-xl border border-gray-200 bg-gray-50 flex flex-col">
                        <p class="text-sm text-gray-500 font-medium mb-2">Ứng dụng tiêu thụ nhiều nhất</p>
                        <div class="space-y-2 overflow-y-auto max-h-[140px] pr-1 custom-scrollbar">
                            ${appsHtml}
                        </div>
                    </div>
                `;
                display.classList.remove('hidden');
                display.classList.add('grid');

                // Cập nhật Biểu đồ 1: Chỉ đường của người được chọn
                dailyChart.data.datasets = JSON.parse(JSON.stringify(originalDailyDatasets)).filter(ds => ds.id === val);
                
                // Cập nhật Biểu đồ 2: So sánh cặp
                if (val === 'khanh' || val === 'linh') {
                    // Hiển thị cả Khánh và Linh
                    crossChart.data.labels = [baseUserLabels[2], baseUserLabels[3]];
                    crossChart.data.datasets = JSON.parse(JSON.stringify(originalCrossDatasets)).map(ds => ({
                        ...ds,
                        data: [ds.data[2], ds.data[3]]
                    }));
                } else if (val === 'bo' || val === 'me') {
                    // Hiển thị cả Bố và Mẹ
                    crossChart.data.labels = [baseUserLabels[0], baseUserLabels[1]];
                    crossChart.data.datasets = JSON.parse(JSON.stringify(originalCrossDatasets)).map(ds => ({
                        ...ds,
                        data: [ds.data[0], ds.data[1]]
                    }));
                }
            }
            
            dailyChart.update();
            crossChart.update();
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            dailyChart.data.datasets.forEach(dataset => {
                const todayIndex = dataset.data.length - 1;
                const increase = (Math.random() * 0.5) + 0.1;
                dataset.data[todayIndex] = Math.min(24, dataset.data[todayIndex] + increase);
            });
            dailyChart.update();

            const btn = document.getElementById('refreshBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'Đã cập nhật! ✓';
            btn.classList.replace('bg-indigo-600', 'bg-emerald-500');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('bg-emerald-500', 'bg-indigo-600');
            }, 1000);
        });
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; rounded: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</body>
</html>
