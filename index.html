<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Thời Gian Dùng Điện Thoại</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-lg p-4 md:p-6">
        <h1 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-6">📱 Dashboard Thời Gian Sử Dụng Điện Thoại</h1>
        
        <div class="relative h-[400px] w-full">
            <canvas id="usageChart"></canvas>
        </div>

        <div class="mt-8 flex flex-col md:flex-row justify-center items-center gap-4">
            <button id="refreshBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:-translate-y-1 w-full md:w-auto flex items-center justify-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Cập nhật dữ liệu hôm nay
            </button>
            <p class="text-sm text-gray-500 text-center md:text-left">
                *Click để mô phỏng tăng thời gian sử dụng của ngày hôm nay.
            </p>
        </div>
    </div>

    <script>
        // Tạo label cho 7 ngày qua
        const getLast7Days = () => {
            const labels = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                if (i === 0) {
                    labels.push('Hôm nay');
                } else {
                    labels.push(`${d.getDate()}/${d.getMonth() + 1}`);
                }
            }
            return labels;
        };

        // Dữ liệu mock ban đầu
        const initialData = {
            labels: getLast7Days(),
            datasets: [
                {
                    label: 'Người dùng A (Giờ)',
                    data: [3.2, 4.1, 2.5, 5.0, 4.2, 3.8, 2.1],
                    backgroundColor: 'rgba(59, 130, 246, 0.6)',
                    borderColor: 'rgba(59, 130, 246, 1)',
                    borderWidth: 1,
                    borderRadius: 4
                },
                {
                    label: 'Người dùng B (Giờ)',
                    data: [5.5, 6.0, 4.8, 5.2, 7.1, 6.5, 4.0],
                    backgroundColor: 'rgba(16, 185, 129, 0.6)',
                    borderColor: 'rgba(16, 185, 129, 1)',
                    borderWidth: 1,
                    borderRadius: 4
                },
                {
                    label: 'Người dùng C (Giờ)',
                    data: [2.0, 1.5, 2.2, 1.8, 2.5, 2.1, 1.2],
                    backgroundColor: 'rgba(245, 158, 11, 0.6)',
                    borderColor: 'rgba(245, 158, 11, 1)',
                    borderWidth: 1,
                    borderRadius: 4
                }
            ]
        };

        const config = {
            type: 'bar',
            data: initialData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Giờ sử dụng'
                        },
                        max: 12
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + context.parsed.y.toFixed(1) + ' giờ';
                            }
                        }
                    }
                }
            }
        };

        // Khởi tạo Chart
        const ctx = document.getElementById('usageChart').getContext('2d');
        const usageChart = new Chart(ctx, config);

        // Xử lý sự kiện click nút Refresh
        document.getElementById('refreshBtn').addEventListener('click', () => {
            usageChart.data.datasets.forEach(dataset => {
                // Lấy index của ngày "Hôm nay" (index cuối cùng = 6)
                const todayIndex = dataset.data.length - 1;
                
                // Tăng thêm random từ 0.2 đến 0.8 giờ
                const increase = (Math.random() * 0.6) + 0.2;
                
                // Cập nhật data, giới hạn max là 24h
                dataset.data[todayIndex] = Math.min(24, dataset.data[todayIndex] + increase);
            });
            
            // Cập nhật lại biểu đồ
            usageChart.update();
            
            // Hiệu ứng nút
            const btn = document.getElementById('refreshBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Đã cập nhật! ✓';
            btn.classList.replace('bg-blue-600', 'bg-green-600');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.replace('bg-green-600', 'bg-blue-600');
            }, 1000);
        });
    </script>
</body>
</html>
